name: Mesure poids des photos (ponctuel)
on:
  push:
    paths: ['tools/measure.mjs', '.github/workflows/measure.yml']
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node tools/measure.mjs
      - run: |
          git config user.name "atelier-stock-bot"; git config user.email "atelier-stock-bot@users.noreply.github.com"
          git add reports/size.txt; git commit -m "Rapport taille photos"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
