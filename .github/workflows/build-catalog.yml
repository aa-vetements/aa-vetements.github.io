name: Mise à jour du catalogue

on:
  schedule:
    - cron: '*/5 * * * *'   # toutes les 5 minutes (GitHub peut retarder un peu)
  workflow_dispatch:
  push:
    paths: ['tools/build-catalog.mjs', '.github/workflows/build-catalog.yml']

concurrency:
  group: build-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer sharp (compression des photos)
        run: npm install --no-save --no-package-lock sharp@0.33
      - name: Construire le catalogue depuis Atelier Stock
        run: node tools/build-catalog.mjs
      - name: Publier si quelque chose a changé
        run: |
          git config user.name "atelier-stock-bot"
          git config user.email "atelier-stock-bot@users.noreply.github.com"
          git add -A catalog.json img
          if git diff --cached --quiet; then echo "Rien à publier"; exit 0; fi
          git commit -m "Catalogue : stock mis à jour"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
